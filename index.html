<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitalyn — Predict. Prevent. Protect.</title>
    <meta name="description" content="Vitalyn — AI-powered predictive healthcare monitoring prototype. Demonstration only, not a medical device." />
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/vitalyn-care.css">

    <!-- installable app -->
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#0b3c68">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vitalyn">
    <meta name="mobile-web-app-capable" content="yes">
  </head>
  <body>
    <div id="root"></div>
    <script src="./js/app.js"></script>
    <script src="./js/vendor-qrcode.js"></script>
    <script src="./js/vitalyn-ble.js"></script>
    <script src="./js/vitalyn-care.js"></script>
    <script>
      window.VITALYN_BUILD = "2026-08-04a";
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").then(function (reg) {
            // pull a newer build immediately instead of waiting for a future visit
            reg.update();
            setInterval(function () { reg.update(); }, 60 * 60 * 1000);
          }).catch(function () {});
        });
        // when a new worker takes over, reload once so stale JS/CSS can't linger
        var refreshed = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (refreshed) return;
          refreshed = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
